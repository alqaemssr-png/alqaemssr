<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a73e8">
  <title>ALQAEM</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 12px; max-width: 500px; margin: auto; background: #f0f2f5; }
    .box { background: #fff; padding: 14px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    input, button { width: 100%; box-sizing: border-box; padding: 12px; margin: 5px 0; border-radius: 8px; font-size: 16px; }
    input { border: 1px solid #ccc; }
    button { background: #1a73e8; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    button.inst { background: #ff6d00; display: none; }
    #chat { height: 55vh; overflow-y: auto; border: 1px solid #e0e0e0; padding: 10px; background: #fafafa; border-radius: 8px; margin-bottom: 8px; }
    .msg-me { background: #e8f0fe; color: #174ea6; padding: 8px 12px; border-radius: 10px; margin: 6px 0; text-align: left; }
    .msg-them { background: #fff; border: 1px solid #ddd; color: #111; padding: 8px 12px; border-radius: 10px; margin: 6px 0; text-align: right; }
  </style>
</head>
<body>

  <div class="box" style="text-align:center;">
    <h3 style="margin:0 0 4px 0;">ALQAEM</h3>
    <div id="status" style="font-weight:bold; color:#e37400;">نیٹ ورک سے جڑ رہا ہے...</div>
    <button id="installBtn" class="inst">📲 موبائل میں ALQAEM انسٹال کریں</button>
  </div>

  <div class="box">
    <div id="chat"></div>
    <input type="text" id="msgInput" placeholder="پیغام لکھیں..." onkeypress="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">بھیجیں</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    });

    // ALQAEM مشترکہ نیٹ ورک کی مستقل ID
    const HUB_ID = 'alqaem-rattowal-global-hub-v1';
    let peer = null;
    let isHub = false;
    let connections = [];
    const seenMsgs = new Set();

    const statusEl = document.getElementById('status');
    const chatEl = document.getElementById('chat');

    function updateStatus() {
      const count = connections.filter(c => c && c.open).length;
      if (isHub) {
        statusEl.innerText = count > 0
          ? `مرکزی نوڈ فعال | ${count} موبائل جڑے ہوئے ہیں`
          : `تیار ہے (باقی موبائلز کا انتظار...)`;
        statusEl.style.color = count > 0 ? "#188038" : "#e37400";
      } else {
        statusEl.innerText = count > 0
          ? `ALQAEM نیٹ ورک سے جڑ گیا!`
          : `مرکز سے رابطہ ہو رہا ہے...`;
        statusEl.style.color = count > 0 ? "#188038" : "#d93025";
      }
    }

    function startNetwork() {
      if (peer) peer.destroy();
      connections = [];
      isHub = false;

      // پہلے مرکزی نوڈ بننے کی کوشش کریں
      peer = new Peer(HUB_ID);

      peer.on('open', () => {
        isHub = true;
        updateStatus();
      });

      peer.on('connection', (conn) => {
        registerConn(conn);
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          // مرکز پہلے سے موجود ہے، بطور ممبر جڑیں
          joinAsMember();
        } else {
          setTimeout(startNetwork, 3000);
        }
      });
    }

    function joinAsMember() {
      if (peer) peer.destroy();
      isHub = false;
      peer = new Peer(); // خودکار منفرد ID

      peer.on('open', () => {
        const conn = peer.connect(HUB_ID, { reliable: true });
        registerConn(conn);
      });

      peer.on('error', () => {
        setTimeout(startNetwork, 3000);
      });
    }

    function registerConn(conn) {
      conn.on('open', () => {
        if (!connections.includes(conn)) connections.push(conn);
        updateStatus();
      });

      conn.on('data', (packet) => {
        if (!packet || !packet.id || seenMsgs.has(packet.id)) return;
        seenMsgs.add(packet.id);

        appendMsg(packet.text, false);

        // اگر یہ مرکزی نوڈ ہے تو پیغام باقی تمام جڑے ہوئے موبائلز کو بھیج دے
        if (isHub) {
          broadcast(packet, conn);
        }
      });

      conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
        updateStatus();
        // اگر ممبر تھا اور مرکز بند ہو گیا تو خود نیا مرکز بننے کی کوشش کرے
        if (!isHub) {
          setTimeout(startNetwork, 1500);
        }
      });
    }

    function broadcast(packet, excludeConn = null) {
      connections.forEach(c => {
        if (c && c.open && c !== excludeConn) {
          c.send(packet);
        }
      });
    }

    function appendMsg(text, isMe) {
      const div = document.createElement('div');
      div.className = isMe ? 'msg-me' : 'msg-them';
      div.innerText = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function sendMsg() {
      const inp = document.getElementById('msgInput');
      const text = inp.value.trim();
      if (!text) return;

      const openConns = connections.filter(c => c && c.open);
      if (openConns.length === 0) {
        alert("ابھی کوئی دوسرا موبائل آن لائن نہیں جڑا۔");
        return;
      }

      const packet = {
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        text: text
      };
      seenMsgs.add(packet.id);
      appendMsg(text, true);
      broadcast(packet);
      inp.value = "";
    }

    startNetwork();
  </script>
</body>
</html>
